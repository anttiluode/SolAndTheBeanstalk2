name: Validate and publish Storm Climber
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic gameplay tests
        run: |
          for file in core.js play.js fast-shader.js climb-core.js climb-render.js climb.js; do node --check "$file"; done
          node --test tests/core.test.cjs tests/startup.test.cjs tests/climb.test.cjs
          node -e 'const h=require("node:fs").readFileSync("story.html","utf8");new Function(h.match(/<script>([\s\S]*?)<\/script>/)[1]);'
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Play the production WebGL build
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/climb-browser.cjs
      - name: Save real-renderer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storm-climber-browser
          path: .artifacts/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Package portable game
        uses: actions/upload-artifact@v4
        with:
          name: storm-climber-portable
          path: |
            index.html
            climb-core.js
            climb-render.js
            climb.js
            climb.css
            story.html
            core.js
            play.js
            play.css
            fast-shader.js
            README.md
            LICENSE
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
